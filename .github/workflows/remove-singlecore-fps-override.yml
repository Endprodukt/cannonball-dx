name: Remove remaining automatic FPS override

on:
  push:
    branches:
      - fix/windowed-display-modes
    paths:
      - .github/workflows/remove-singlecore-fps-override.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windowed-display-modes
          fetch-depth: 0

      - name: Remove single-core automatic 30 FPS lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/main.cpp')
          text = path.read_text()
          old = '                if (cannonball::fps_lock == 0) cannonball::fps_lock = 30; // lock to 30fps unless user has overriden\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one automatic single-core FPS override, found {text.count(old)}')
          text = text.replace(old, '', 1)
          path.write_text(text)
          PY

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/remove-singlecore-fps-override.yml
          git config user.name "Endprodukt"
          git config user.email "o.carell@kabelmail.de"
          git add src/main/main.cpp .github/workflows/remove-singlecore-fps-override.yml
          git commit -m "Remove remaining automatic frame-rate override"
          git push origin HEAD:fix/windowed-display-modes
