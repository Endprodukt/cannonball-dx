name: Simple FFB Spring Staging

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.head_ref == 'staging/simple-ffb-spring'
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Simple FFB spring fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              with Path(path).open('w', encoding='utf-8', newline='\n') as f:
                  f.write(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, got {count}: {old!r}')
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} matches, got {count}: {old!r}')
              write(path, text.replace(old, new))

          # SIMPLE uses the existing Centering setting as a fixed spring.
          # MODERN keeps the existing tuned/dynamic spring path unchanged.
          replace_once(
              'src/main/directx/ffeedback_base.cpp',
              '''        g_centering_percent = config.ffb_modern_enabled()\n            ? std::max(0, tuned_centering_for_source(percent, source))\n            : 0;''',
              '''        g_centering_percent = config.ffb_modern_enabled()\n            ? std::max(0, tuned_centering_for_source(percent, source))\n            : clamp_percent(percent);''')

          replace_once(
              'src/main/engine/ooutputs_base.cpp',
              '''                forcefeedback::set_tyre_slip(false);\n                forcefeedback::set_centering_strength(0);''',
              '''                forcefeedback::set_tyre_slip(false);\n                forcefeedback::set_centering_strength(\n                    config.controls.centering_strength);''')

          # Keep the same menu/ownership hooks, but give SIMPLE the configured
          # fixed spring instead of explicitly disabling the spring.
          replace_all(
              'src/main/frontend/menu.cpp',
              'config.ffb_modern_enabled() ? low_speed_spring_strength() : 0',
              'config.ffb_modern_enabled()\n                    ? low_speed_spring_strength()\n                    : config.controls.centering_strength',
              3)

          # The menu spring refresh must also run in SIMPLE so changing the
          # existing Centering value is reflected immediately.
          replace_once(
              'src/main/frontend/menu.cpp',
              '''        !config.controls.haptic ||\n        !config.input_mode_is_wheel() ||\n        !config.ffb_modern_enabled())''',
              '''        !config.controls.haptic ||\n        !config.input_mode_is_wheel())''')

          replace_once(
              'src/main/frontend/menu.cpp',
              '''    const int desired_strength = low_speed_spring_strength();''',
              '''    const int desired_strength = config.ffb_modern_enabled()\n        ? low_speed_spring_strength()\n        : config.controls.centering_strength;''')

          # Sanity: Modern's tuned path must still exist and Simple must use
          # the two existing master settings independently.
          checks = {
              'src/main/directx/ffeedback_base.cpp': [
                  'std::max(0, tuned_centering_for_source(percent, source))',
                  ': clamp_percent(percent)',
                  ': clamp_percent(config.controls.ffb_strength)',
              ],
              'src/main/engine/ooutputs_base.cpp': [
                  'config.controls.centering_strength',
                  'if (!config.ffb_modern_enabled())',
              ],
              'src/main/frontend/menu.cpp': [
                  '? low_speed_spring_strength()',
                  ': config.controls.centering_strength',
              ],
          }
          for path, needles in checks.items():
              text = read(path)
              for needle in needles:
                  if needle not in text:
                      raise RuntimeError(f'{path}: missing marker {needle!r}')

          print('Simple FFB spring patch applied successfully.')
          PY

          git diff --check
          git diff --stat

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-release -A x64 `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DWITH_MARCH_NATIVE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build\Release\cannonball-dx.exe")) {
            throw "Release build completed without producing cannonball-dx.exe"
          }

      - name: Commit validated source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/directx/ffeedback_base.cpp `
                  src/main/engine/ooutputs_base.cpp `
                  src/main/frontend/menu.cpp
          git diff --cached --check
          git commit -m "Simple FFB: restore configurable spring [skip ci]"
          git push origin HEAD:staging/simple-ffb-spring
