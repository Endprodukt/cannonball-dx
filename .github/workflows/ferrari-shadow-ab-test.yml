name: Ferrari shadow A/B test

on:
  push:
    branches: [test/graphics-regression-clean]
    paths:
      - .github/workflows/ferrari-shadow-ab-test.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/graphics-regression-clean
          fetch-depth: 0

      - name: Disable only dedicated Ferrari shadow draw
        shell: pwsh
        run: |
          $path = 'src/main/engine/oferrari_base.cpp'
          $text = (Get-Content $path -Raw).Replace("`r`n", "`n")

          $old = @(
            '        if (oroad.get_view_mode() != ORoad::VIEW_INCAR)',
            '            osprites.do_spr_order_shadows(spr_shadow);'
          ) -join "`n"

          $new = @(
            '        // TEMP A/B TEST: suppress only the dedicated Ferrari shadow.',
            '        // If the black bottom stripe remains, it belongs to the Ferrari sprite itself.',
            '        if (false && oroad.get_view_mode() != ORoad::VIEW_INCAR)',
            '            osprites.do_spr_order_shadows(spr_shadow);'
          ) -join "`n"

          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected one Ferrari shadow draw block, found $count" }
          $text = $text.Replace($old, $new)
          Set-Content $path $text -Encoding UTF8 -NoNewline

          git diff --check
          git diff -- src/main/engine/oferrari_base.cpp

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/engine/oferrari_base.cpp
          git commit -m 'Temporarily disable Ferrari shadow for stripe isolation'
          git push origin HEAD:test/graphics-regression-clean
