name: Promote hi-res shadow fix to master

on:
  push:
    branches: [test/graphics-regression-clean]
    paths:
      - .github/workflows/promote-shadow-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply confirmed hi-res shadow fix
        shell: pwsh
        run: |
          $path = 'src/main/hwvideo/hwsprites.cpp'
          $text = (Get-Content $path -Raw).Replace("`r`n", "`n")

          $oldHi = @(
            '                    const bool shadowfound =',
            '                        shadow && (spriterom_shadowinfo[addr] == 0x11);'
          ) -join "`n"
          $newHi = @(
            '                    // Hi-res must always interpret 0xA through the hardware',
            '                    // shadow path. Relying on lazily populated row metadata',
            '                    // can render an unprimed shadow row as a dark colour.',
            '                    const bool shadowfound = shadow;'
          ) -join "`n"
          $count = ([regex]::Matches($text, [regex]::Escape($oldHi))).Count
          if ($count -ne 1) { throw "Expected one 3x/4x shadowfound block, found $count" }
          $text = $text.Replace($oldHi, $newHi)

          $oldStd = '                bool shadowfound = shadow && (spriterom_shadowinfo[addr] == 0x11);'
          $newStd = @(
            '                // Keep the metadata optimisation at native resolution only.',
            '                // In hi-res every hardware-shadow row uses shadow semantics.',
            '                bool shadowfound = shadow &&',
            '                    (render_scale > 1 || spriterom_shadowinfo[addr] == 0x11);'
          ) -join "`n"
          $count = ([regex]::Matches($text, [regex]::Escape($oldStd))).Count
          if ($count -ne 1) { throw "Expected one 1x/2x shadowfound line, found $count" }
          $text = $text.Replace($oldStd, $newStd)

          Set-Content $path $text -Encoding UTF8 -NoNewline
          git diff --check
          git diff -- src/main/hwvideo/hwsprites.cpp

      - name: Commit to master
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/hwvideo/hwsprites.cpp
          git commit -m 'Fix hi-res shadow cache warmup artifacts'
          git push origin HEAD:master
