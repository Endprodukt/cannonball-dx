name: One-shot F7 persistence and CRT seam fixes

on:
  push:
    branches:
      - test/hires-sprite-alignment
    paths:
      - .github/workflows/oneshot-f7-crt-seam.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/hires-sprite-alignment
          fetch-depth: 0

      - name: Persist F7 hi-res sprite toggle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/sdl2/input.cpp')
          s = p.read_text()
          old = '''    handle_key_down_base(keysym);\n\n    if (keysym->sym == key_config[12]) set_key_state(VIEW1, true);\n'''
          new = '''    const int hiresprites_before = config.video.hiresprites;\n    handle_key_down_base(keysym);\n\n    // F7 is a runtime hotkey, so unlike the frontend it has no later menu-save\n    // latch. Persist only a real toggle (the low-res guard can leave it unchanged).\n    if (keysym->sym == SDLK_F7 &&\n        config.video.hiresprites != hiresprites_before &&\n        !config.save())\n    {\n        std::cerr << "Unable to save hi-res sprite setting." << std::endl;\n    }\n\n    if (keysym->sym == key_config[12]) set_key_state(VIEW1, true);\n'''
          if old not in s:
              raise SystemExit('F7 persistence anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/sdl2/input.cpp
          git commit -m "Persist F7 hi-res sprite toggle"

      - name: Port isolated SE CRT two-thread seam fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Anchor not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, count))

          replace(
              'src/main/sdl2/renderbase.hpp',
              '    virtual void focus_window() {}\n\n    // S16 video hardware ladder DAC values\n',
              '    virtual void focus_window() {}\n\n    // Advance the Blargg NTSC burst phase once, before render workers are released.\n    // Renderers without the NTSC filter keep the default no-op.\n    virtual void advance_blargg_phase() {}\n\n    // S16 video hardware ladder DAC values\n')

          replace(
              'src/main/sdl2/rendersurface.hpp',
              '    void draw_frame(uint16_t* pixels, int fastpass);\n\nprotected:\n',
              '    void draw_frame(uint16_t* pixels, int fastpass);\n    void advance_blargg_phase() override;\n\nprotected:\n')

          replace(
              'src/main/video.hpp',
              '    void render_frame(int fastpass);\n    void present_frame();\n',
              '    void render_frame(int fastpass);\n    void advance_blargg_phase();\n    void present_frame();\n')

          replace(
              'src/main/video_bugfix_base.cpp',
              '''void Video::render_frame(int fastpass)\n{\n    // draw the frame from the pixel buffer not in use for writing\n    uint16_t* renderer_pixels = pixel_buffers[current_pixel_buffer ^ 1] + alignment;\n    renderer->draw_frame(renderer_pixels, fastpass);\n}\n\nvoid Video::present_frame()\n''',
              '''void Video::render_frame(int fastpass)\n{\n    // draw the frame from the pixel buffer not in use for writing\n    uint16_t* renderer_pixels = pixel_buffers[current_pixel_buffer ^ 1] + alignment;\n    renderer->draw_frame(renderer_pixels, fastpass);\n}\n\nvoid Video::advance_blargg_phase()\n{\n    renderer->advance_blargg_phase();\n}\n\nvoid Video::present_frame()\n''')

          replace(
              'src/main/sdl2/rendersurface.cpp',
              '''}\n\n\n// ----------------------------------------------------------------------------------\n// set_scaling - determines the X and Y parameters and image position\n''',
              '''}\n\n\nvoid RenderSurface::advance_blargg_phase()\n{\n    // draw_frame() can run concurrently for the top and bottom halves. Advance\n    // the shared NTSC phase on the main thread before either worker is released.\n    if (!blargg) return;\n    if (config.fps == 60) phase = (phase + 1) % 3;\n    else                  phase = (phase + 2) % 3;\n}\n\n\n// ----------------------------------------------------------------------------------\n// set_scaling - determines the X and Y parameters and image position\n''')

          replace(
              'src/main/sdl2/rendersurface.cpp',
              '''    if (!blargg)\n        return;\n\n    for (int row = 0; row < block_height; ++row)\n''',
              '''    if (!blargg)\n        return;\n\n    // A continuous Blargg pass advances the 3-phase NTSC burst once per row.\n    // When two workers split the frame, the bottom half must begin at the phase\n    // the top half would have reached, rather than restarting at the seam.\n    const int section_phase =\n        section == 1 ? (phase + block_height) % 3 : phase;\n\n    for (int row = 0; row < block_height; ++row)\n''')

          # Only the three blitter calls inside blargg_filter use this exact indentation.
          p = Path('src/main/sdl2/rendersurface.cpp')
          s = p.read_text()
          start = s.index('void RenderSurface::blargg_filter')
          end = s.index('\n\n#include <stdint.h>', start)
          block = s[start:end]
          if block.count('\n                phase,\n') != 2 or block.count('\n            phase,\n') != 1:
              raise SystemExit('Unexpected Blargg phase call layout')
          block = block.replace('\n                phase,\n', '\n                section_phase,\n')
          block = block.replace('\n            phase,\n', '\n            section_phase,\n')
          s = s[:start] + block + s[end:]
          p.write_text(s)

          replace(
              'src/main/sdl2/rendersurface.cpp',
              '''        if (fastpass!=1) {\n            if (config.fps == 60) phase = (phase + 1) % 3; // cycle through 0/1/2\n            else                  phase = (phase + 2) % 3; // cycle through 0/1/2, but at twice the rate\n        }\n        blargg_filter(pixels, writePixels, fastpass);\n''',
              '''        // Phase is advanced once per frame on the main thread before render\n        // workers are released; blargg_filter() offsets the bottom half itself.\n        blargg_filter(pixels, writePixels, fastpass);\n''')

          replace(
              'src/main/main.cpp',
              '''        if (using_threading) {\n            // Set NTSC filter to work on the last complete frame immediately\n            renderReady0.release();\n''',
              '''        if (using_threading) {\n            // Advance the NTSC burst phase while both render workers are idle.\n            // This gives top and bottom halves one stable phase for the frame.\n            video.advance_blargg_phase();\n\n            // Set NTSC filter to work on the last complete frame immediately\n            renderReady0.release();\n''')

          replace(
              'src/main/main.cpp',
              '''            tick();\n            audio.tick();\n            video.prepare_frame();\n            video.render_frame(-1);\n''',
              '''            tick();\n            audio.tick();\n            video.prepare_frame();\n            video.advance_blargg_phase();\n            video.render_frame(-1);\n''')
          PY
          git add src/main/main.cpp src/main/video.hpp src/main/video_bugfix_base.cpp src/main/sdl2/renderbase.hpp src/main/sdl2/rendersurface.hpp src/main/sdl2/rendersurface.cpp
          git commit -m "Fix CRT filter seam with two render threads"

      - name: Push fixes
        shell: bash
        run: git push origin HEAD:test/hires-sprite-alignment
