name: Apply issue 36 overlay resize follow-up

on:
  push:
    branches:
      - fix/issue-36-multimonitor

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply follow-up
        run: python3 tools/apply_issue36_overlay_resize.py
      - name: Commit follow-up
        run: |
          rm tools/apply_issue36_overlay_resize.py
          rm .github/workflows/apply-issue36-overlay-resize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Resize CRT overlay with active display"
          git push origin HEAD:fix/issue-36-multimonitor
