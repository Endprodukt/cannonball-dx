name: Engine Resolution Scale Test

on:
  push:
    branches:
      - test/engine-resolution-scale

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/engine-resolution-scale

      - name: Apply follow-up compatibility fixes
        run: python3 tools/fix_engine_resolution_scale_followup.py

      - name: Validate source changes
        run: |
          git diff --check
          git status --short

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main
          git commit -m "Fix 3x-4x renderer compatibility"
          git push origin HEAD:test/engine-resolution-scale

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DWITH_MP3=OFF -DPIXEL_ACCURACY=OFF -DWITH_MARCH_NATIVE=OFF

      - name: Build
        run: cmake --build build --config Release -j2
