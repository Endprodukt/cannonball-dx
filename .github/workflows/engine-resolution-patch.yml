name: Engine Resolution Scale Test

on:
  push:
    branches:
      - test/engine-resolution-scale

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/engine-resolution-scale

      - name: Apply independent scaler notification overlay
        run: python3 tools/fix_pixel_scaler_notification_overlay.py

      - name: Apply quiescent resolution restart fix
        run: python3 tools/fix_engine_resolution_quiescent_restart.py

      - name: Reset worker semaphores between renderer generations
        run: python3 tools/fix_engine_resolution_semaphore_reset.py

      - name: Validate source changes
        run: |
          git diff --check
          git status --short

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main
          if ! git diff --cached --quiet; then
            git commit -m "Harden engine resolution restart synchronization"
            git push origin HEAD:test/engine-resolution-scale
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libtinyxml2-dev libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libmpg123-dev

      - name: Configure
        run: cmake -S . -B build -DWITH_MP3=ON -DPIXEL_ACCURACY=OFF -DWITH_MARCH_NATIVE=OFF

      - name: Build
        run: cmake --build build --config Release -j2
