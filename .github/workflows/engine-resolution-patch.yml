        // which is ideal for 1x/2x but clips the vertical replication needed by
        // 3x and 4x. Use the same pixel/shadow macros one row at a time here.
        if (render_scale > 2)
        {
            for (y = top; y != ytarget; y += ydelta)
            {
                if (y >= 0 && y < config.s16_height)
                {
                    uint16_t* pPix1 = pixels + (y * scrn_width) + xpos;
                    uint32_t spriteaddr = addr;
                    int32_t xacc = 0;
                    const bool shadowfound = shadow && (spriterom_shadowinfo[addr] == 0x11);

                    if (!shadowfound)
                    {
                        if (clip)
