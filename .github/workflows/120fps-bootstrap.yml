name: Fix 120 FPS checkpoint timing

on:
  push:
    branches: [test/120fps]
    paths:
      - .github/workflows/120fps-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/120fps
          fetch-depth: 0

      - name: Keep granular road timing at 60 Hz
        shell: pwsh
        run: |
          $path = 'src/main/engine/outrun_base.cpp'
          $text = (Get-Content $path -Raw).Replace("`r`n", "`n")

          $old = @(
            '    const bool tick_60hz = config.fps != 120 || ((cannonball::frame & 1) == 0);',
            '    if (tick_60hz)',
            '    {',
            '        otiles.update_tilemaps(cannonball_mode == MODE_ORIGINAL ? ostats.cur_stage : 0);',
            '        opalette.cycle_sky_palette();',
            '        opalette.fade_palette();',
            '        ostats.do_timers();',
            '    }',
            '',
            '    if (cannonball_mode != MODE_TTRIAL) ohud.draw_timer1(ostats.time_counter);',
            '    oinitengine.set_granular_position();'
          ) -join "`n"

          $new = @(
            '    const bool tick_60hz = config.fps != 120 || ((cannonball::frame & 1) == 0);',
            '    if (tick_60hz)',
            '    {',
            '        otiles.update_tilemaps(cannonball_mode == MODE_ORIGINAL ? ostats.cur_stage : 0);',
            '        opalette.cycle_sky_palette();',
            '        opalette.fade_palette();',
            '        ostats.do_timers();',
            '',
            '        // Granular road position feeds sprite_scroll_speed and therefore',
            '        // checkpoint-sprite progression. Keep it on the original 60 Hz',
            '        // VBlank cadence at 120 FPS so sprite timing stays in lockstep',
            '        // with the timer/checkpoint state machine.',
            '        oinitengine.set_granular_position();',
            '    }',
            '',
            '    if (cannonball_mode != MODE_TTRIAL) ohud.draw_timer1(ostats.time_counter);'
          ) -join "`n"

          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected one VBlank timing block, found $count" }
          $text = $text.Replace($old, $new)
          Set-Content $path $text -Encoding UTF8 -NoNewline

          git diff --check
          git diff -- src/main/engine/outrun_base.cpp

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/engine/outrun_base.cpp
          git commit -m 'Keep granular road timing at 60 Hz in 120 FPS mode'
          git push origin HEAD:test/120fps
