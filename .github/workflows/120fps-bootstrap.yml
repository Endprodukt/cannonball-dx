name: Bootstrap 120 FPS test branch

on:
  push:
    branches: [test/120fps]
    paths:
      - .github/workflows/120fps-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/120fps
          fetch-depth: 0

      - name: Apply 120 FPS timing changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Main scheduler / command line.
          replace_once('src/main/main.cpp',
              '- Selectable 30/60fps operation',
              '- Selectable 30/60/120fps operation')
          replace_once('src/main/main.cpp',
              'int     cannonball::fps_lock            = 0; // 0=use config, 30/60=command-line override',
              'int     cannonball::fps_lock            = 0; // 0=use config, 30/60/120=command-line override')
          replace_once('src/main/main.cpp',
              '''    // Determine whether to tick certain logic for the current frame.\n    tick_frame = (config.fps == 60) ?\n                 (((frame & 1) == 0) ? 1 : 0)\n                 : 1;''',
              '''    // Keep the original main game logic at 30 Hz while allowing the\n    // smooth road/sprite/render paths to run at the selected output rate.\n    // 30 FPS: every frame, 60 FPS: every 2nd frame, 120 FPS: every 4th.\n    const int core_divisor = std::max(1, config.fps / 30);\n    tick_frame = (frame % core_divisor) == 0;''')
          replace_once('src/main/main.cpp',
              '''    // Frame rate is an explicit user setting. -30/-60 remain optional\n    // command-line overrides, but there is no automatic performance switch.\n    int configured_fps =\n        cannonball::fps_lock == 30 ? 30 :\n        cannonball::fps_lock == 60 ? 60 :\n        (config.video.fps == 0 ? 30 : 60);\n    config.video.fps = configured_fps == 30 ? 0 : 2;''',
              '''    // Frame rate is an explicit user setting. -30/-60/-120 remain optional\n    // command-line overrides, but there is no automatic performance switch.\n    int configured_fps =\n        cannonball::fps_lock == 30  ? 30  :\n        cannonball::fps_lock == 60  ? 60  :\n        cannonball::fps_lock == 120 ? 120 :\n        (config.video.fps == 0 ? 30 : (config.video.fps == 3 ? 120 : 60));\n    config.video.fps = configured_fps == 30 ? 0 : (configured_fps == 120 ? 3 : 2);''')
          replace_once('src/main/main.cpp',
              '''        else if (strcmp(argv[i], "-60") == 0) {\n            cannonball::fps_lock = 60;\n        }''',
              '''        else if (strcmp(argv[i], "-60") == 0) {\n            cannonball::fps_lock = 60;\n        }\n        else if (strcmp(argv[i], "-120") == 0) {\n            cannonball::fps_lock = 120;\n        }''')
          replace_once('src/main/main.cpp',
              '                         "-60                  : Lock to 60fps\\n" <<',
              '                         "-60                  : Lock to 60fps\\n" <<\n                         "-120                 : Lock to 120fps\\n" <<')
          replace_once('src/main/main.cpp',
              '// Command-line -30/-60 remains authoritative for this run.',
              '// Command-line -30/-60/-120 remains authoritative for this run.')
          replace_once('src/main/main.cpp',
              'CannonBall DX requires wayland video driver for 60fps operation under desktop environment.',
              'CannonBall DX requires wayland video driver for high-refresh operation under desktop environment.')

          # Persistent frame-rate setting: 0=30, 2=60 (legacy), 3=120.
          replace_once('src/main/frontend/config_base.cpp',
              '''    video.fps           = cfg.get_int("video.fps",             2); // 0 = 30 FPS, 2 = 60 FPS; default 60\n    video.fps           = video.fps == 0 ? 0 : 2;               // Normalize legacy ORIGINAL/other values to 60 FPS''',
              '''    video.fps           = cfg.get_int("video.fps",             2); // 0=30 FPS, 2=60 FPS, 3=120 FPS; default 60\n    if (video.fps != 0 && video.fps != 3)\n        video.fps = 2;                                          // Normalize legacy non-zero values to 60 FPS''')
          replace_once('src/main/frontend/config_base.cpp',
              '    cfg.put_int("video.fps",                video.fps);           // Frame Rate: 0=30 FPS, 2=60 FPS',
              '    cfg.put_int("video.fps",                video.fps);           // Frame Rate: 0=30 FPS, 2=60 FPS, 3=120 FPS')
          replace_once('src/main/frontend/config_base.cpp',
              '''void Config::set_fps(int fps)\n{\n    video.fps = fps;\n    // Set core FPS to 30fps or 60fps\n    this->fps = video.fps == 0 ? 30 : 60;\n\n    // Original game ticks sprites at 30fps but background scroll at 60fps\n    tick_fps  = video.fps < 2 ? 30 : 60;\n\n    cannonball::frame_ms = 1000.0 / this->fps;''',
              '''void Config::set_fps(int fps)\n{\n    video.fps = fps;\n\n    // 0/2 are the historical CannonBall values. DX adds 3 for 120 FPS.\n    this->fps = video.fps == 0 ? 30 : (video.fps == 3 ? 120 : 60);\n\n    // Smooth-mode helpers use this to scale movement per rendered frame.\n    tick_fps = this->fps;\n\n    cannonball::frame_ms = 1000.0 / this->fps;''')

          # Expose 30 / 60 / 120 in the Video menu.
          replace_once('src/main/frontend/menu_base.cpp',
              '''    // FPS not now needed - frame rate now automatically switches\n    menu_video.push_back(ENTRY_FPS_COUNTER);''',
              '''    menu_video.push_back(ENTRY_FRAME_RATE);\n    menu_video.push_back(ENTRY_FPS_COUNTER);''')
          replace_once('src/main/frontend/menu_base.cpp',
              '''            else if (SELECTED(ENTRY_FRAME_RATE))\n            {\n                config.video.fps = config.video.fps == 0 ? 2 : 0;\n                config.set_fps(config.video.fps);\n            }''',
              '''            else if (SELECTED(ENTRY_FRAME_RATE))\n            {\n                config.video.fps = config.video.fps == 0 ? 2 :\n                                   config.video.fps == 2 ? 3 : 0;\n                config.set_fps(config.video.fps);\n            }''')
          replace_once('src/main/frontend/menu_base.cpp',
              '            else if (SELECTED(ENTRY_FRAME_RATE))    set_menu_text(ENTRY_FRAME_RATE, config.video.fps == 0 ? "30 FPS" : "60 FPS");',
              '            else if (SELECTED(ENTRY_FRAME_RATE))    set_menu_text(ENTRY_FRAME_RATE, config.video.fps == 0 ? "30 FPS" : (config.video.fps == 3 ? "120 FPS" : "60 FPS"));')

          # 120 Hz smooth mode already has quarter-step sprite/traffic movement. Preserve\n          # the real-time duration of the traffic split masking and camera easing too.
          replace_once('src/main/engine/otraffic.cpp',
              '            sprite->hidden = (config.fps == 60) ? 4 : 2;',
              '            sprite->hidden = config.fps == 120 ? 8 : (config.fps == 60 ? 4 : 2);')
          replace_once('src/main/engine/oroad_base.cpp',
              '''    // Enhancement: Adjust View\n    if (horizon_target != horizon_offset)''',
              '''    // Enhancement: Adjust View. At 120 Hz use half-sized steps so the\n    // transition takes the same real time while gaining intermediate positions.\n    const int16_t horizon_step = config.tick_fps == 120 ? 8 : 16;\n    if (horizon_target != horizon_offset)''')
          replace_once('src/main/engine/oroad_base.cpp', '            horizon_offset -= 16;', '            horizon_offset -= horizon_step;')
          replace_once('src/main/engine/oroad_base.cpp', '            horizon_offset += 16;', '            horizon_offset += horizon_step;')
          replace_once('src/main/engine/oroad.cpp',
              '        const int16_t step = 0x10;',
              '        const int16_t step = config.tick_fps == 120 ? 0x08 : 0x10;')

          # VBlank-owned timers, palette fades and tilemap state are historically 60 Hz in\n          # smooth mode. Keep their real-time cadence at 120 while the road/sprite paths\n          # continue to update every 8.33 ms.
          replace_once('src/main/engine/outrun_base.cpp',
              '''void Outrun::vint()\n{\n    otiles.write_tilemap_hw();\n    osprites.update_sprites();\n    otiles.update_tilemaps(cannonball_mode == MODE_ORIGINAL ? ostats.cur_stage : 0);\n    opalette.cycle_sky_palette();\n    opalette.fade_palette();\n    ostats.do_timers();\n    if (cannonball_mode != MODE_TTRIAL) ohud.draw_timer1(ostats.time_counter);\n    oinitengine.set_granular_position();\n}''',
              '''void Outrun::vint()\n{\n    otiles.write_tilemap_hw();\n    osprites.update_sprites();\n\n    // These routines own counters calibrated for the existing 60 Hz smooth\n    // mode. At 120 Hz run them every second output frame to preserve game time,\n    // palette/fade duration and tilemap transition speed.\n    const bool tick_60hz = config.fps != 120 || ((cannonball::frame & 1) == 0);\n    if (tick_60hz)\n    {\n        otiles.update_tilemaps(cannonball_mode == MODE_ORIGINAL ? ostats.cur_stage : 0);\n        opalette.cycle_sky_palette();\n        opalette.fade_palette();\n        ostats.do_timers();\n    }\n\n    if (cannonball_mode != MODE_TTRIAL) ohud.draw_timer1(ostats.time_counter);\n    oinitengine.set_granular_position();\n}''')

          # Comments kept in sync with the supported values.
          replace_once('src/main/main.hpp',
              'extern int  fps_lock; // 0=use config setting, 30/60=command-line override',
              'extern int  fps_lock; // 0=use config setting, 30/60/120=command-line override')
          replace_once('src/main/frontend/config_base.hpp', '    // 30 or 60 fps', '    // 30, 60 or 120 fps')

          # Static guardrails for the test branch.
          checks = {
              'src/main/main.cpp': ['fps_lock == 120', 'core_divisor', '"-120'],
              'src/main/frontend/config_base.cpp': ['video.fps == 3 ? 120', 'tick_fps = this->fps'],
              'src/main/frontend/menu_base.cpp': ['"120 FPS"', 'menu_video.push_back(ENTRY_FRAME_RATE)'],
              'src/main/engine/otraffic.cpp': ['config.tick_fps == 120', 'config.fps == 120 ? 8'],
              'src/main/engine/osprites.cpp': ['config.tick_fps == 120'],
              'src/main/engine/outrun_base.cpp': ['tick_60hz'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing required 120 FPS guard: {needle}')
          '@ | Set-Content -Encoding UTF8 patch_120fps.py
          python patch_120fps.py
          Remove-Item patch_120fps.py
          git diff --check
          git diff --stat

      - name: Configure vcpkg environment
        shell: pwsh
        run: |
          if ($env:VCPKG_INSTALLATION_ROOT) {
            "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif (Test-Path 'C:\vcpkg') {
            "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            throw 'Could not locate vcpkg on the Windows runner.'
          }

      - name: Configure Release build
        run: cmake --preset windows-release

      - name: Build Release
        run: cmake --build --preset windows-release --parallel

      - name: Smoke-test 120 FPS command line
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter cannonball-dx.exe | Select-Object -First 1
          if (-not $exe) { throw 'cannonball-dx.exe not found after build.' }
          $help = (& $exe.FullName --help 2>&1 | Out-String)
          if ($help -notmatch '-120\s+: Lock to 120fps') {
            Write-Host $help
            throw 'The built executable does not advertise the -120 override.'
          }
          Write-Host '120 FPS CLI smoke test passed.'

      - name: Commit tested source changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main
          git commit -m 'Add experimental 120 FPS mode'
          git push origin HEAD:test/120fps
