name: Fix 120 FPS frontend road timing

on:
  push:
    branches: [test/120fps]
    paths:
      - .github/workflows/120fps-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/120fps
          fetch-depth: 0

      - name: Fix frontend road simulation timing
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('src/main/frontend/menu_base.cpp')
          text = path.read_text(encoding='utf-8')

          start_marker = '    // Shift horizon\n'
          end_marker = '    // Do Animations at 30 fps\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''    // The menu road has its own simulation loop, separate from gameplay.\n    // At 120 FPS keep that simulation on the established 60 Hz cadence so\n    // road speed, acceleration, horizon movement and granular scrolling keep\n    // exactly the same real-time behaviour as the existing 60 FPS mode.\n    const bool frontend_road_tick =\n        config.fps != 120 || ((frame & 1) == 0);\n\n    if (frontend_road_tick)\n    {\n        // Shift horizon\n        if (oroad.horizon_base > HORIZON_DEST)\n        {\n            oroad.horizon_base -= config.fps == 30 ? 2 : 1;\n            if (oroad.horizon_base < HORIZON_DEST)\n                oroad.horizon_base = HORIZON_DEST;\n        }\n        // Advance road\n        else\n        {\n            const uint32_t scroll_speed =\n                config.fps == 30 ? (config.menu.road_scroll_speed << 1) :\n                                   config.menu.road_scroll_speed;\n\n            if (oinitengine.car_increment < scroll_speed << 16)\n                oinitengine.car_increment += (1 << 14);\n            if (oinitengine.car_increment > scroll_speed << 16)\n                oinitengine.car_increment = scroll_speed << 16;\n\n            uint32_t result = 0x12F * (oinitengine.car_increment >> 16);\n            oroad.road_pos_change = result;\n            oroad.road_pos += result;\n            if (oroad.road_pos >> 16 > ROAD_END) // loop to beginning of track data\n                oroad.road_pos = 0;\n\n            oinitengine.update_road();\n            oinitengine.set_granular_position();\n            oroad.road_width_bak = oroad.road_width >> 16;\n            oroad.car_x_bak = -oroad.road_width_bak;\n            oinitengine.car_x_pos = oroad.car_x_bak;\n        }\n    }\n\n'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          # Static guardrails: 120 Hz must no longer use half-speed values every frame.
          updated = path.read_text(encoding='utf-8')
          required = [
              'const bool frontend_road_tick',
              'config.fps != 120 || ((frame & 1) == 0)',
              'config.fps == 30 ? (config.menu.road_scroll_speed << 1)',
              'oinitengine.car_increment += (1 << 14)',
              'config.fps == 120 && (frame & 3) == 0',
          ]
          for needle in required:
              if needle not in updated:
                  raise SystemExit(f'missing frontend timing guard: {needle}')

          forbidden = [
              'config.fps == 120 ? std::max(1, config.menu.road_scroll_speed >> 1)',
              'config.fps == 120 ? (1 << 13) : (1 << 14)',
          ]
          for needle in forbidden:
              if needle in updated:
                  raise SystemExit(f'old 120 frontend scaling still present: {needle}')
          '@ | Set-Content -Encoding UTF8 fix_frontend_road_120.py
          python fix_frontend_road_120.py
          Remove-Item fix_frontend_road_120.py
          git diff --check
          git diff -- src/main/frontend/menu_base.cpp

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/frontend/menu_base.cpp
          git commit -m 'Fix 120 FPS frontend road timing'
          git push origin HEAD:test/120fps
