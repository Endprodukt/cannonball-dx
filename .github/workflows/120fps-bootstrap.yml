name: Rename CRT emulation menu

on:
  push:
    branches: [test/120fps]
    paths:
      - .github/workflows/120fps-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/120fps
          fetch-depth: 0

      - name: Rename menu entry
        shell: pwsh
        run: |
          $path = 'src/main/frontend/menu_legacy.hpp.inc'
          $text = Get-Content $path -Raw
          $old = 'CRT / VIDEO EMULATION'
          $new = 'CRT EMULATION...'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -lt 2) { throw "Expected active label references, found $count" }
          $text = $text.Replace($old, $new)
          Set-Content $path $text -Encoding UTF8 -NoNewline
          git diff --check
          git diff -- $path

      - name: Commit rename
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/frontend/menu_legacy.hpp.inc
          git commit -m 'Rename CRT emulation menu'
          git push origin HEAD:test/120fps
