name: Remove duplicate DX menu direction handler

on:
  push:
    branches: [test/120fps]
    paths:
      - .github/workflows/120fps-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/120fps
          fetch-depth: 0

      - name: Remove duplicate menu direction path
        shell: pwsh
        run: |
          $path = 'src/main/frontend/menu.cpp'
          $text = Get-Content $path -Raw

          $start = '    // Use held-state edges for menu LEFT/RIGHT.'
          $end = '    // The original frontend uses analog steering as a menu up/down control.'
          $startIndex = $text.IndexOf($start)
          $endIndex = $text.IndexOf($end)

          if ($startIndex -lt 0 -or $endIndex -lt 0 -or $endIndex -le $startIndex) {
            throw 'Could not locate duplicate LEFT/RIGHT handler block.'
          }

          $text = $text.Substring(0, $startIndex) + $text.Substring($endIndex)
          Set-Content $path $text -Encoding UTF8 -NoNewline

          $check = Get-Content $path -Raw
          if ($check.Contains('Use held-state edges for menu LEFT/RIGHT')) {
            throw 'Duplicate LEFT/RIGHT handler still present.'
          }

          git diff --check
          git diff -- src/main/frontend/menu.cpp

      - name: Commit cleanup
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/frontend/menu.cpp
          git commit -m 'Remove duplicate menu direction handler'
          git push origin HEAD:test/120fps
