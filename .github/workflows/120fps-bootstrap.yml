name: Restore SDL window focus

on:
  push:
    branches: [test/120fps]
    paths:
      - .github/workflows/120fps-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/120fps
          fetch-depth: 0

      - name: Add focus recovery
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/main/sdl2/renderbase.hpp',
              '''    virtual bool supports_window() { return true; }\n    virtual bool supports_vsync() { return false; }\n''',
              '''    virtual bool supports_window() { return true; }\n    virtual bool supports_vsync() { return false; }\n    virtual void focus_window() {}\n''')

          replace_once(
              'src/main/sdl2/rendersurface.hpp',
              '''    void swap_buffers();\n    void disable();\n    bool start_frame() {return true;};\n''',
              '''    void swap_buffers();\n    void disable();\n    void focus_window() override;\n    bool start_frame() {return true;};\n''')

          replace_once(
              'src/main/sdl2/rendersurface.cpp',
              '''    initialised = false;\n}\n\n\nvoid RenderSurface::create_buffers() {\n''',
              '''    initialised = false;\n}\n\nvoid RenderSurface::focus_window()\n{\n    if (!window)\n        return;\n\n    // Do this only when CannonBall explicitly asks for focus after startup or\n    // a renderer restart. SDL window creation/fullscreen transitions alone do\n    // not reliably leave the new window focused on Windows.\n    SDL_ShowWindow(window);\n    SDL_RaiseWindow(window);\n\n    if (SDL_SetWindowInputFocus(window) != 0)\n    {\n        std::cerr << "Unable to focus CannonBall window: "\n                  << SDL_GetError() << std::endl;\n    }\n}\n\n\nvoid RenderSurface::create_buffers() {\n''')

          replace_once(
              'src/main/video.hpp',
              '''    void swap_buffers();\n    void disable();\n    int set_video_mode(video_settings_t* settings);\n''',
              '''    void swap_buffers();\n    void disable();\n    void focus_window();\n    int set_video_mode(video_settings_t* settings);\n''')

          replace_once(
              'src/main/video.cpp',
              '''    enabled = false;\n}\n\n// ------------------------------------------------------------------------------------------------\n// Configure video settings from config file\n''',
              '''    enabled = false;\n}\n\nvoid Video::focus_window()\n{\n    if (renderer)\n        renderer->focus_window();\n}\n\n// ------------------------------------------------------------------------------------------------\n// Configure video settings from config file\n''')

          replace_once(
              'src/main/main.cpp',
              '''            video.sprite_layer->set_x_clip(false);\n            config.videoRestartRequired = false;\n\n            // Only expose the newly-created renderer to workers after every\n''',
              '''            video.sprite_layer->set_x_clip(false);\n            config.videoRestartRequired = false;\n            video.focus_window();\n\n            // Only expose the newly-created renderer to workers after every\n''')

          replace_once(
              'src/main/main.cpp',
              '''    // Now start the main game loop, which includes SDL video and input\n    audio.init();\n    const int exit_code = main_loop();\n''',
              '''    // Now start the main game loop, which includes SDL video and input.\n    // Request focus only after video, controllers, haptics and audio are all\n    // initialized so no later startup subsystem can leave the SDL window in\n    // the background. This also makes direct EXE launches behave like launchers\n    // that explicitly activate the CannonBall window.\n    audio.init();\n    video.focus_window();\n    const int exit_code = main_loop();\n''')
          '@ | python -

          git diff --check
          git diff -- src/main/sdl2/renderbase.hpp src/main/sdl2/rendersurface.hpp src/main/sdl2/rendersurface.cpp src/main/video.hpp src/main/video.cpp src/main/main.cpp

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/sdl2/renderbase.hpp src/main/sdl2/rendersurface.hpp src/main/sdl2/rendersurface.cpp src/main/video.hpp src/main/video.cpp src/main/main.cpp
          git commit -m 'Restore SDL window focus after startup'
          git push origin HEAD:test/120fps
