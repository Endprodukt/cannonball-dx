name: Fix surface-rattle branch syntax

on:
  push:
    branches:
      - agent/rough-surface-crash-ffb

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rough-surface-crash-ffb
          fetch-depth: 0
      - name: Fix syntax
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main/engine/ooutputs_base.cpp')
          s = p.read_text()
          old = '''            break;\n        }\n\n        // GamePad: Basic Rumble\n'''
          new = '''            break;\n\n        // GamePad: Basic Rumble\n'''
          if old not in s:
              raise SystemExit('syntax target not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/engine/ooutputs_base.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Fix FFB output switch syntax"
          git push
