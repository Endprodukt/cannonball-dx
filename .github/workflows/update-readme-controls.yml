name: Update control documentation

on:
  push:
    branches:
      - readme-controls-current

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[readme-controls]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README control sections
        run: python3 .github/scripts/update_readme_controls.py
      - name: Commit README updates
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.txt
          git commit -m "Update README control defaults and hotkeys"
          git push origin HEAD:readme-controls-current
