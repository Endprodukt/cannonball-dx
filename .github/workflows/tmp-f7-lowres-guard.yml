name: Apply F7 low-res guard

on:
  push:
    branches:
      - test/hires-sprite-alignment
    paths:
      - .github/workflows/tmp-f7-lowres-guard.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/hires-sprite-alignment
          fetch-depth: 0

      - name: Apply isolated F7 guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/sdl2/input_base.cpp')
          s = p.read_text()
          old = '''        case SDLK_F7:\n            // JJP - switches between sprite rendering (original/hi-res)\n            if (!is_pressed) break;\n            config.video.hiresprites ^= 1;\n            break;\n'''
          new = '''        case SDLK_F7:\n            // JJP - switches between sprite rendering (original/hi-res)\n            // Hi-res sprites are only valid while the hi-res engine is active.\n            if (!is_pressed) break;\n            if (!config.video.hires) break;\n            config.video.hiresprites ^= 1;\n            break;\n'''
          if old not in s:
              raise SystemExit('Expected F7 block not found; refusing to modify file')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-f7-lowres-guard.yml
          git add src/main/sdl2/input_base.cpp
          git commit -m "Guard F7 hi-res sprites in low-res engine mode"
          git push origin HEAD:test/hires-sprite-alignment
