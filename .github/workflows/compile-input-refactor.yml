name: Compile input refactor

on:
  push:
    branches:
      - menu-actions-decoupled

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, '[compile-input-refactor]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix system-action release semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/sdl2/input.cpp')
          s = p.read_text()
          start = s.index('    int system_action_state_for_event(')
          end = s.index('\n    bool group_has_axis_target(', start)
          old = s[start:end]
          new = '''    int system_action_state_for_event(
        int action,
        const std::string& signature,
        int type,
        int index,
        int value,
        bool button_pressed,
        int group)
    {
        if (signature.empty())
            return -1;

        // A press is context-sensitive, but its matching release must always be
        // allowed through. Menu Accept can launch gameplay before SDL delivers
        // Button-Up; rejecting that release outside STATE_MENU leaves ACCEPT
        // logically held and makes the next menu visit swallow its first press.
        const bool press_allowed =
            action == Config::SYSTEM_ACTION_PAUSE
                ? cannonball::state == cannonball::STATE_GAME &&
                  group == config.input_mode()
                : cannonball::state == cannonball::STATE_MENU;

        const int stored_type =
            config.system_action_binding_type(action, group);
        const int stored_index =
            config.system_action_binding_index(action, group);
        const std::string stored_device =
            config.system_action_binding_device(action, group);

        // "!" is an explicit unbound marker. Empty means no custom binding and
        // therefore allows the standard GAMEPAD fallback below.
        if (stored_device == "!")
            return -1;

        const bool has_custom_binding =
            stored_type >= device_binding_t::TYPE_BUTTON &&
            stored_type <= device_binding_t::TYPE_HAT &&
            stored_index >= 0 &&
            !stored_device.empty();

        if (has_custom_binding)
        {
            if (stored_device != signature ||
                stored_type != type ||
                stored_index != index)
            {
                return -1;
            }

            bool active = button_pressed;
            if (type == device_binding_t::TYPE_HAT)
            {
                const int direction =
                    config.system_action_binding_value(action, group);
                active = direction != SDL_HAT_CENTERED &&
                    (value & direction) != 0;
            }

            if (active && !press_allowed)
                return -1;

            return active ? 1 : 0;
        }

        // Standard SDL controller defaults are fallbacks, not aliases to the
        // gameplay actions. Once a custom binding exists it replaces only this
        // system action. Wheel/raw-device bindings intentionally have no default.
        if (group == Input::BINDING_GAMEPAD &&
            type == device_binding_t::TYPE_BUTTON &&
            index == default_system_gamepad_button(action))
        {
            if (button_pressed && !press_allowed)
                return -1;

            return button_pressed ? 1 : 0;
        }

        return -1;
    }
'''
          if old == new:
              raise SystemExit('input.cpp already patched')
          p.write_text(s[:start] + new + s[end:])
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/sdl2/input.cpp
          git commit -m "Clear system actions on release across state changes"
          git push origin HEAD:menu-actions-decoupled

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsdl2-dev libtinyxml2-dev libegl1-mesa-dev libgles2-mesa-dev libudev-dev libmpg123-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DWITH_MARCH_NATIVE=OFF -DWITH_MP3=OFF -DQUIET_BUILD=ON

      - name: Build
        run: cmake --build build --parallel 2
