name: Compile input refactor

on:
  push:
    branches:
      - menu-actions-decoupled

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, '[compile-input-refactor]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore global Input declaration
        run: |
          if ! grep -q '^extern Input input;$' src/main/sdl2/input.hpp; then
            printf '\nextern Input input;\n' >> src/main/sdl2/input.hpp
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/sdl2/input.hpp
          if ! git diff --cached --quiet; then
            git commit -m "Restore global Input declaration"
            git push origin HEAD:menu-actions-decoupled
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsdl2-dev libtinyxml2-dev libegl1-mesa-dev libgles2-mesa-dev libudev-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DWITH_MARCH_NATIVE=OFF -DWITH_MP3=OFF -DQUIET_BUILD=ON
      - name: Build
        run: cmake --build build --parallel 2
