name: Apply console and cloud cleanup

on:
  push:
    branches:
      - fix/windowed-display-modes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windowed-display-modes
          fetch-depth: 0

      - name: Apply focused source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              data = p.read_bytes()
              old_b = old.encode('utf-8')
              new_b = new.encode('utf-8')
              if old_b not in data:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_bytes(data.replace(old_b, new_b, 1))

          # Renderer diagnostics. Work on bytes so its CRLF style stays intact.
          p = Path('src/main/sdl2/rendersurface.cpp')
          data = p.read_bytes()
          lines = [
              b'                std::cout << "Image centered horizontally, ";',
              b'                std::cout << "Image centered vertically, ";',
              b'        std::cout << "Image anchor point: " << anchor_x << "," << anchor_y << "\\n";',
          ]
          for line in lines:
              data = data.replace(line + b'\r\n', b'').replace(line + b'\n', b'')
          pixel_crlf = b'    Uint32 window_format = SDL_GetWindowPixelFormat(window);\r\n    printf("Window Pixel Format: %s (0x%08X)\\n", SDL_GetPixelFormatName(window_format), window_format);\r\n\r\n'
          pixel_lf = pixel_crlf.replace(b'\r\n', b'\n')
          if pixel_crlf in data:
              data = data.replace(pixel_crlf, b'', 1)
          elif pixel_lf in data:
              data = data.replace(pixel_lf, b'', 1)
          else:
              raise SystemExit('Window Pixel Format block not found')
          p.write_bytes(data)

          # Missing logical score sections are normal; keep defaults silently.
          replace_once(
              'src/main/frontend/config_base.cpp',
              '    if (!xml_parser::read_xml(scores_file, scores)) {\n        std::cerr << "Warning: " << scores_file << " could not be loaded." << std::endl;\n        return;\n    }\n',
              '    // A missing logical score section is normal on first run. Keep the\n    // built-in defaults silently; DX stores all live tables in highscores.xml.\n    if (!xml_parser::read_xml(scores_file, scores))\n        return;\n')

          # Preserve cloud entry state when extra off-screen copies are tested.
          replace_once(
              'src/main/engine/osprites.cpp',
              '            const uint16_t original_dst_index = entry->dst_index;\n            const int32_t tile_width = static_cast<int32_t>(entry->width);\n',
              '            const uint16_t original_dst_index = entry->dst_index;\n            const uint8_t original_control = entry->control;\n            const int32_t tile_width = static_cast<int32_t>(entry->width);\n')

          # Replace fixed +/-1 cloud repetition with viewport-derived repetition.
          replace_once(
              'src/main/engine/osprites.cpp',
              '            add_cloud_copy(static_cast<int32_t>(original_x) - tile_width);\n            add_cloud_copy(static_cast<int32_t>(original_x) + tile_width);\n',
              '            // Derive repetition count from the actual logical 21:9 width.\n            // Add a small safety margin so the sheet also extends just beyond\n            // the visible edges instead of ending exactly on the viewport.\n            const int32_t visible_width = S16_WIDTH + (config.s16_x_off << 1);\n            const int32_t required_width = visible_width + 16;\n            int32_t copies_each_side = 1;\n            while (((copies_each_side * 2 + 1) * tile_width) < required_width)\n                copies_each_side++;\n\n            for (int32_t step = 1; step <= copies_each_side; step++)\n            {\n                add_cloud_copy(static_cast<int32_t>(original_x) - (tile_width * step));\n                add_cloud_copy(static_cast<int32_t>(original_x) + (tile_width * step));\n            }\n')

          replace_once(
              'src/main/engine/osprites.cpp',
              '            entry->x = original_x;\n            entry->dst_index = original_dst_index;\n        }\n',
              '            entry->x = original_x;\n            entry->dst_index = original_dst_index;\n            entry->control = original_control;\n        }\n')
          PY

          git diff --check
          test -z "$(grep -F 'Window Pixel Format:' src/main/sdl2/rendersurface.cpp || true)"
          test -z "$(grep -F 'Image anchor point:' src/main/sdl2/rendersurface.cpp || true)"
          test -z "$(grep -F 'Image centered horizontally' src/main/sdl2/rendersurface.cpp || true)"
          test -z "$(grep -F 'Image centered vertically' src/main/sdl2/rendersurface.cpp || true)"
          test -z "$(grep -F 'std::cerr << "Warning: " << scores_file' src/main/frontend/config_base.cpp || true)"
          grep -F 'const int32_t required_width = visible_width + 16;' src/main/engine/osprites.cpp

      - name: Commit focused changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-console-cloud-cleanup.yml
          git add src/main/sdl2/rendersurface.cpp src/main/frontend/config_base.cpp src/main/engine/osprites.cpp
          git commit -m "Clean console output and extend ultrawide clouds"
          git push origin HEAD:fix/windowed-display-modes
