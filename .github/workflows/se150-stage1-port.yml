name: SE 1.50 selective port stage 1

on:
  push:
    branches:
      - test/se-1.50-selective-sync
    paths:
      - tools/apply_se150_stage1.py
      - .github/workflows/se150-stage1-port.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/se-1.50-selective-sync
          fetch-depth: 0

      - name: Apply selective SE 1.50 fixes
        run: python3 tools/apply_se150_stage1.py

      - name: Commit result and remove temporary helper
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_se150_stage1.py .github/workflows/se150-stage1-port.yml
          git add -A
          git commit -m "Port selected CannonBall-SE 1.50 stability fixes"
          git push origin HEAD:test/se-1.50-selective-sync
