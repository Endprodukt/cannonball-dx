name: Apply issue 36 multi-monitor patch

on:
  push:
    branches:
      - fix/issue-36-multimonitor

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_issue36_multimonitor.py

      - name: Commit patched sources
        run: |
          rm tools/apply_issue36_multimonitor.py
          rm .github/workflows/apply-issue36-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix multi-monitor display handling (#36)"
          git push origin HEAD:fix/issue-36-multimonitor
