name: Linux Build

on:
  push:
    branches:
      - linux-parity
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            libsdl2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libtinyxml2-dev \
            libmpg123-dev \
            libudev-dev

      - name: Configure
        run: >-
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_MARCH_NATIVE=OFF

      - name: Build
        run: cmake --build build-linux --parallel 2

      - name: Smoke-check executable
        run: test -x build-linux/cannonball-dx

      - name: Show runtime dependencies
        run: ldd build-linux/cannonball-dx

      - name: Assemble test package
        run: |
          mkdir -p dist/cannonball-dx/roms
          cp build-linux/cannonball-dx dist/cannonball-dx/
          cp build-linux/tilemap.bin dist/cannonball-dx/
          cp build-linux/tilepatch.bin dist/cannonball-dx/
          cp build-linux/gamecontrollerdb.txt dist/cannonball-dx/
          cp -a res dist/cannonball-dx/
          cp roms/roms.txt dist/cannonball-dx/roms/
          cp -a docs dist/cannonball-dx/
          cat > dist/cannonball-dx/run.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          cd "$(dirname "$0")"
          exec ./cannonball-dx "$@"
          EOF
          chmod +x dist/cannonball-dx/run.sh

      - name: Upload Linux test build
        uses: actions/upload-artifact@v4
        with:
          name: cannonball-dx-linux-x86_64
          path: dist/cannonball-dx
          if-no-files-found: error
          retention-days: 14
