name: Linux Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu 24.04 x64 Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libsdl2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libglu1-mesa-dev \
            libmpg123-dev \
            libtinyxml2-dev \
            libudev-dev

      - name: Verify build tools
        run: |
          cmake --version
          c++ --version
          pkg-config --modversion sdl2
          pkg-config --modversion egl
          pkg-config --modversion glesv2

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_MARCH_NATIVE=OFF \
            '-DCMAKE_BUILD_RPATH=$ORIGIN/lib'

      - name: Build
        run: cmake --build build --parallel

      - name: Verify executable
        run: |
          test -x build/cannonball-dx
          file build/cannonball-dx
          ldd build/cannonball-dx

      - name: Assemble Linux release package
        run: |
          rm -rf dist
          mkdir -p dist/cannonball-dx/roms

          cp build/cannonball-dx dist/cannonball-dx/

          # TinyXML2 changes its soname between distributions (SteamOS has no
          # libtinyxml2.so.10), so ship the one the executable was linked
          # against. The executable finds it through its $ORIGIN/lib rpath.
          mkdir -p dist/cannonball-dx/lib
          tinyxml2_lib="$(ldd build/cannonball-dx | awk '/libtinyxml2[.]so/ { print $3 }')"
          test -f "$tinyxml2_lib"
          cp -L "$tinyxml2_lib" "dist/cannonball-dx/lib/$(basename "$tinyxml2_lib")"
          cp /usr/share/doc/libtinyxml2-dev/copyright dist/cannonball-dx/lib/tinyxml2-license.txt

          readelf -d dist/cannonball-dx/cannonball-dx | grep -E 'R(UN)?PATH.*[$]ORIGIN/lib'
          # The bundled copy must win over the system library.
          (cd dist/cannonball-dx && ldd ./cannonball-dx | grep -F libtinyxml2 | tee /dev/stderr | grep -vq x86_64-linux-gnu)
          cp -r res dist/cannonball-dx/res
          cp -r docs dist/cannonball-dx/docs
          cp roms/roms.txt dist/cannonball-dx/roms/roms.txt
          cp README.txt dist/cannonball-dx/

          # Keep repository-only documentation out of the user-facing package,
          # matching the Windows release layout.
          for file in README.md EXTERNAL_OUTPUTS.md CHANGELOG CHANGELOG.md; do
            if find dist/cannonball-dx -type f -name "$file" | grep -q .; then
              echo "Repository-only documentation found in Linux package: $file"
              exit 1
            fi
          done

          for file in tilemap.bin tilepatch.bin gamecontrollerdb.txt; do
            if [ -f "dist/cannonball-dx/$file" ]; then
              echo "$file must only exist under res, not in the release root."
              exit 1
            fi
          done

          echo "Linux package contents:"
          find dist/cannonball-dx -maxdepth 3 -type f | sort

          # Artifact uploads drop the executable bit; a tarball keeps it.
          tar -C dist -czf dist/cannonball-dx-linux-x64.tar.gz cannonball-dx

      - name: Upload Linux release package
        uses: actions/upload-artifact@v4
        with:
          name: cannonball-dx-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: dist/cannonball-dx-linux-x64.tar.gz
