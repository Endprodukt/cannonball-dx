name: Linux Build

on:
  push:
    branches:
      - linux-parity
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            libsdl2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libtinyxml2-dev \
            libmpg123-dev \
            libudev-dev

      - name: Configure
        run: >-
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_MARCH_NATIVE=OFF

      - name: Build
        run: cmake --build build-linux --parallel 2

      - name: Smoke-check executable
        run: test -x build-linux/cannonball-dx
