name: Tune rough-surface FFB to 5 percent

on:
  push:
    branches:
      - agent/rough-surface-crash-ffb

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rough-surface-crash-ffb
          fetch-depth: 0
      - name: Lower rough-surface gain
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main/engine/ooutputs_base.cpp')
          s = p.read_text()
          old = '        const int rattle_gain = 7;\n'
          new = '        const int rattle_gain = 5;\n'
          if old not in s:
              raise SystemExit('rattle gain 7 not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit tuning and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/engine/ooutputs_base.cpp
          git rm .github/workflows/agent-rattle-5.yml
          git commit -m "Lower rough-surface FFB gain to 5 percent"
          git push
