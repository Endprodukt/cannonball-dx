name: Hardcode menu fallbacks

on:
  push:
    branches:
      - hotfix/permanent-menu-enter-esc

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[hardcode-menu-fallbacks]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add permanent Enter and Esc menu fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/sdl2/input_base.cpp')
          s = p.read_text()
          old = '''    // Permanent menu navigation fallback.\n// Arrow keys must always remain usable.\n    if (key == SDLK_UP)    set_key_state(UP, is_pressed);\n    if (key == SDLK_DOWN)  set_key_state(DOWN, is_pressed);\n    if (key == SDLK_LEFT)  set_key_state(LEFT, is_pressed);\n    if (key == SDLK_RIGHT) set_key_state(RIGHT, is_pressed);\n'''
          new = '''    // Permanent frontend keyboard fallbacks. These remain available even if\n    // the configurable Menu Accept / Menu Back bindings are changed or cleared.\n    if (key == SDLK_UP)     set_key_state(UP, is_pressed);\n    if (key == SDLK_DOWN)   set_key_state(DOWN, is_pressed);\n    if (key == SDLK_LEFT)   set_key_state(LEFT, is_pressed);\n    if (key == SDLK_RIGHT)  set_key_state(RIGHT, is_pressed);\n    if (key == SDLK_RETURN) set_key_state(ACCEPT, is_pressed);\n    if (key == SDLK_ESCAPE) set_key_state(BACK, is_pressed);\n'''
          if old not in s:
              raise SystemExit('Expected permanent fallback block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/sdl2/input_base.cpp
          git commit -m "Hardcode Enter and Esc menu fallbacks"
          git push origin HEAD:hotfix/permanent-menu-enter-esc
