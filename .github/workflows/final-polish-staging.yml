              '            ohud.blit_text_new(1, STATUS_Y + 1, "DEL/BSP - CLEAR   ESC - EXIT", ohud.GREY);')

          replace_all(
              'src/main/frontend/menu.cpp',
              'if (selected_row == BACK_ROW)\n            selected_col = COL_KEYBOARD;',
              'if (selected_row >= BINDING_ROWS)\n            selected_col = COL_KEYBOARD;',
              2)

          replace_once(
              'src/main/frontend/menu.cpp',
              '        if (selected_row == BACK_ROW)\n        {\n            osoundint.queue_sound(sound::BEEP1);\n            leave_editor();\n            return;\n        }',
              '''        if (selected_row == SAVE_ROW)\n        {\n            osoundint.queue_sound(sound::BEEP1);\n            leave_editor();\n            return;\n        }\n\n        if (selected_row == CANCEL_ROW)\n        {\n            restore_snapshot();\n            config_save_pending = true;\n            osoundint.queue_sound(sound::BEEP1);\n            leave_editor();\n            return;\n        }''')

          if 'BACK_ROW' in read('src/main/frontend/menu.cpp'):
              raise RuntimeError('menu.cpp: stale BACK_ROW references remain after SAVE/CANCEL conversion')

