              '''        ohud.blit_text_new(\n            14,\n            SAVE_Y,\n            "SAVE",\n            selected_row == SAVE_ROW ? ohud.PINK : ohud.GREEN);\n        ohud.blit_text_new(\n            22,\n            CANCEL_Y,\n            "CANCEL",\n            selected_row == CANCEL_ROW ? ohud.PINK : ohud.GREEN);''')

