              '    const int SAVE_ROW = BINDING_ROWS;\n    const int CANCEL_ROW = BINDING_ROWS + 1;\n    const int EDITOR_ROWS = BINDING_ROWS + 2;\n    const int EDITOR_COLUMNS = 3;\n    const int SAVE_Y = 23;\n    const int CANCEL_Y = 24;\n    const int STATUS_Y = 25;')

          replace_once(
