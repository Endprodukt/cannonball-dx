name: Final Polish Staging

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.head_ref == 'staging/final-polish'
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              with Path(path).open('w', encoding='utf-8', newline='\n') as f:
                  f.write(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one exact match, got {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} matches, got {count}: {old[:80]!r}')
              write(path, text.replace(old, new))

          def regex_once(path, pattern, replacement):
              text = read(path)
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: regex expected one match: {pattern[:100]!r}')
              write(path, text)

          # ------------------------------------------------------------------
          # Stable audio device selection by name.
          # ------------------------------------------------------------------
          replace_once(
              'src/main/frontend/config_base.hpp',
              '    int playback_device; // omit from config file or set to -1 to use system default\n    int wave_volume;',
              '    int playback_device; // omit from config file or set to -1 to use system default\n    std::string playback_device_name; // stable SDL device name; takes priority over index when available\n    int wave_volume;')

          replace_once(
              'src/main/frontend/config_base.cpp',
              '    // Index of SDL playback device to request, -1 for default\n    sound.playback_device = cfg.get_int("sound.playback_device", -1);',
              '    // Index of SDL playback device to request, -1 for default\n    sound.playback_device = cfg.get_int("sound.playback_device", -1);\n    // Stable device name. This survives SDL/Windows enumeration-order changes.\n    sound.playback_device_name = cfg.get_string("sound.playback_device_name", "");')

          replace_once(
              'src/main/frontend/config_base.cpp',
              '    cfg.put_int("sound.playback_device",    sound.playback_device);  // JJP - Index of SDL playback device to request, -1 for default  \n    cfg.put_int("sound.wave_volume",        sound.wave_volume);',
              '    cfg.put_int("sound.playback_device",    sound.playback_device);  // JJP - Index fallback for SDL playback device\n    cfg.put_string("sound.playback_device_name", sound.playback_device_name); // Stable name takes priority over index\n    cfg.put_int("sound.wave_volume",        sound.wave_volume);')

          replace_once(
              'src/main/frontend/config.cpp',
              '        sound.playback_device = -1;\n',
              '        sound.playback_device = -1;\n        sound.playback_device_name.clear();\n')

          regex_once(
              'src/main/sdl2/audio.cpp',
              r'        const char\* playback_device = NULL;\n        if \(config\.sound\.playback_device != -1 && config\.sound\.playback_device < numDevices\) \{\n            // User has configured a particular output device; find its name\n            playback_device = device_name\[config\.sound\.playback_device\];\n        \}\n',
              '''        const char* playback_device = NULL;\n        int resolved_device = -1;\n\n        // Prefer the stable SDL endpoint name. Device indices can move between\n        // boots, Windows updates and USB/Bluetooth reconnects. Match the exact\n        // name first, then a substring for SDL backends that decorate names.\n        if (!config.sound.playback_device_name.empty())\n        {\n            for (int i = 0; i < numDevices; ++i)\n            {\n                if (device_name[i] && config.sound.playback_device_name == device_name[i])\n                {\n                    resolved_device = i;\n                    break;\n                }\n            }\n\n            if (resolved_device < 0)\n            {\n                for (int i = 0; i < numDevices; ++i)\n                {\n                    if (device_name[i] &&\n                        std::string(device_name[i]).find(config.sound.playback_device_name) != std::string::npos)\n                    {\n                        resolved_device = i;\n                        break;\n                    }\n                }\n            }\n\n            if (resolved_device < 0)\n            {\n                std::cerr << "Configured audio device not found: "\n                          << config.sound.playback_device_name\n                          << ". Falling back to index/default." << std::endl;\n            }\n        }\n\n        if (resolved_device < 0 &&\n            config.sound.playback_device >= 0 &&\n            config.sound.playback_device < numDevices)\n        {\n            resolved_device = config.sound.playback_device;\n        }\n\n        if (resolved_device >= 0)\n        {\n            playback_device = device_name[resolved_device];\n            config.sound.playback_device = resolved_device;\n        }\n''')

          # Sound menu: keep the exact device name in config while rendering a
          # font-safe/truncated version on the legacy 40-column HUD.
          regex_once(
              'src/main/frontend/menu.hpp',
              r'    static std::string audio_output_menu_text\(\)\n    \{.*?\n    \}\n\n    static std::string menu_sounds_menu_text\(\)',
              '''    static std::string audio_font_safe(const std::string& input)\n    {\n        std::string out;\n        out.reserve(input.size());\n\n        for (unsigned char c : input)\n        {\n            char u = static_cast<char>(c);\n            if (u >= 'a' && u <= 'z')\n                u = static_cast<char>(u - 'a' + 'A');\n\n            if ((u >= 'A' && u <= 'Z') ||\n                (u >= '0' && u <= '9') ||\n                u == ' ' || u == '-' || u == '.' ||\n                u == '%' || u == '!' || u == ',' || u == '/')\n            {\n                if (u != ' ' || out.empty() || out.back() != ' ')\n                    out += u;\n            }\n        }\n\n        while (!out.empty() && out.front() == ' ') out.erase(out.begin());\n        while (!out.empty() && out.back() == ' ') out.pop_back();\n        return out.empty() ? std::string("DEVICE") : out;\n    }\n\n    static std::string audio_output_menu_text()\n    {\n        const int count = audio_device_count();\n        int device = -1;\n\n        if (!config.sound.playback_device_name.empty())\n        {\n            for (int i = 0; i < count; ++i)\n            {\n                const char* name = SDL_GetAudioDeviceName(i, 0);\n                if (name && config.sound.playback_device_name == name)\n                {\n                    device = i;\n                    break;\n                }\n            }\n        }\n\n        if (device < 0 &&\n            config.sound.playback_device >= 0 &&\n            config.sound.playback_device < count)\n        {\n            device = config.sound.playback_device;\n        }\n\n        if (device < 0)\n            return std::string(AUDIO_OUTPUT_LABEL) + "DEFAULT";\n\n        const char* device_name = SDL_GetAudioDeviceName(device, 0);\n        std::string value = audio_font_safe(\n            !config.sound.playback_device_name.empty()\n                ? config.sound.playback_device_name\n                : (device_name && *device_name\n                    ? std::string(device_name)\n                    : std::string("DEVICE ") + std::to_string(device + 1)));\n\n        const size_t max_value_length = 24;\n        if (value.size() > max_value_length)\n            value = value.substr(0, max_value_length - 3) + "...";\n\n        return std::string(AUDIO_OUTPUT_LABEL) + value;\n    }\n\n    static std::string menu_sounds_menu_text()''')

          regex_once(
              'src/main/frontend/menu.hpp',
              r'    void cycle_audio_output\(int direction\)\n    \{.*?\n    \}\n\n    static const FfbMenuItem\* dx_ffb_effect_items',
              '''    void cycle_audio_output(int direction)\n    {\n        const int count = audio_device_count();\n        const int slots = count + 1; // DEFAULT + every enumerated device\n\n        int position = 0;\n        if (!config.sound.playback_device_name.empty())\n        {\n            for (int i = 0; i < count; ++i)\n            {\n                const char* name = SDL_GetAudioDeviceName(i, 0);\n                if (name && config.sound.playback_device_name == name)\n                {\n                    position = i + 1;\n                    break;\n                }\n            }\n        }\n\n        if (position == 0 &&\n            config.sound.playback_device >= 0 &&\n            config.sound.playback_device < count)\n        {\n            position = config.sound.playback_device + 1;\n        }\n\n        position = (position + (direction < 0 ? -1 : 1) + slots) % slots;\n\n        if (position == 0)\n        {\n            config.sound.playback_device = -1;\n            config.sound.playback_device_name.clear();\n        }\n        else\n        {\n            config.sound.playback_device = position - 1;\n            const char* name = SDL_GetAudioDeviceName(position - 1, 0);\n            config.sound.playback_device_name = name ? name : "";\n        }\n\n        if (config.sound.enabled)\n        {\n            cannonball::audio.stop_audio();\n            cannonball::audio.start_audio();\n\n            if (!cannonball::audio.sound_enabled &&\n                config.sound.playback_device != -1)\n            {\n                config.sound.playback_device = -1;\n                config.sound.playback_device_name.clear();\n                cannonball::audio.start_audio();\n                display_message("AUDIO DEVICE UNAVAILABLE - USING DEFAULT");\n            }\n        }\n    }\n\n    static const FfbMenuItem* dx_ffb_effect_items''')

          # ------------------------------------------------------------------
          # Per-binding metadata + automatic axis inversion.
          # ------------------------------------------------------------------
          replace_once(
              'src/main/frontend/config_base.hpp',
              '    std::string device;         // persistent SDL device signature, or "*" for legacy any-device binding\n};',
              '    std::string device;         // persistent SDL device signature, or "*" for legacy any-device binding\n    uint16_t vid = 0;            // fallback identity if SDL GUID changes\n    uint16_t pid = 0;\n    bool invert = false;          // per-axis direction, derived automatically during capture\n};')

          replace_once(
              'src/main/frontend/config.cpp',
              '        binding.value = value;\n        binding.device = device.empty() ? "*" : device;\n        controls.device_bindings.push_back(binding);',
              '        binding.value = value;\n        binding.device = device.empty() ? "*" : device;\n        if (type == device_binding_t::TYPE_AXIS && target == device_binding_t::TARGET_ACCEL)\n            binding.invert = controls.invert[1];\n        else if (type == device_binding_t::TYPE_AXIS && target == device_binding_t::TARGET_BRAKE)\n            binding.invert = controls.invert[2];\n        controls.device_bindings.push_back(binding);')

          regex_once(
              'src/main/frontend/config.cpp',
              r'    bool parse_device_bindings\(.*?\n    \}\n\n    bool parent_has_comment',
              '''    bool parse_device_bindings(\n        const std::string& encoded,\n        bool legacy_accel_invert,\n        bool legacy_brake_invert,\n        std::vector<device_binding_t>& bindings)\n    {\n        bindings.clear();\n\n        if (encoded.empty())\n            return false;\n\n        std::stringstream entries(encoded);\n        std::string entry;\n\n        while (std::getline(entries, entry, ';'))\n        {\n            if (entry.empty())\n                continue;\n\n            std::stringstream fields_stream(entry);\n            std::vector<std::string> fields;\n            std::string field;\n            while (std::getline(fields_stream, field, ','))\n                fields.push_back(field);\n\n            if (fields.size() < 5)\n                continue;\n\n            try\n            {\n                device_binding_t binding;\n                binding.target = std::stoi(fields[0]);\n                binding.type = std::stoi(fields[1]);\n                binding.index = std::stoi(fields[2]);\n                binding.value = std::stoi(fields[3]);\n                binding.device = fields[4];\n\n                if (binding.target < device_binding_t::TARGET_STEER ||\n                    binding.target > device_binding_t::TARGET_VIEW3 ||\n                    binding.type < device_binding_t::TYPE_BUTTON ||\n                    binding.type > device_binding_t::TYPE_HAT ||\n                    binding.index < 0 ||\n                    binding.device.empty())\n                {\n                    continue;\n                }\n\n                if (fields.size() > 5 && !fields[5].empty())\n                    binding.vid = static_cast<uint16_t>(std::stoul(fields[5]));\n                if (fields.size() > 6 && !fields[6].empty())\n                    binding.pid = static_cast<uint16_t>(std::stoul(fields[6]));\n\n                if (fields.size() > 7 && !fields[7].empty())\n                {\n                    binding.invert = std::stoi(fields[7]) != 0;\n                }\n                else if (binding.type == device_binding_t::TYPE_AXIS &&\n                         binding.target == device_binding_t::TARGET_ACCEL)\n                {\n                    binding.invert = legacy_accel_invert;\n                }\n                else if (binding.type == device_binding_t::TYPE_AXIS &&\n                         binding.target == device_binding_t::TARGET_BRAKE)\n                {\n                    binding.invert = legacy_brake_invert;\n                }\n\n                bindings.push_back(binding);\n            }\n            catch (...)\n            {\n                // Ignore malformed entries and keep loading the rest.\n            }\n        }\n\n        return true;\n    }\n\n    std::string encode_device_bindings(\n        const std::vector<device_binding_t>& bindings)\n    {\n        std::ostringstream encoded;\n        bool first = true;\n\n        for (const auto& binding : bindings)\n        {\n            if (binding.index < 0 || binding.device.empty())\n                continue;\n\n            if (!first)\n                encoded << ';';\n\n            first = false;\n            encoded\n                << binding.target << ','\n                << binding.type << ','\n                << binding.index << ','\n                << binding.value << ','\n                << binding.device << ','\n                << binding.vid << ','\n                << binding.pid << ','\n                << (binding.invert ? 1 : 0);\n        }\n\n        return encoded.str();\n    }\n\n    bool parent_has_comment''')

          replace_once(
              'src/main/frontend/config.cpp',
              '        parse_device_bindings(encoded, controls.device_bindings);',
              '        parse_device_bindings(encoded, controls.invert[1], controls.invert[2], controls.device_bindings);')

          replace_once(
              'src/main/sdl2/input.hpp',
              '    int axes = 0;\n    int buttons = 0;\n    int hats = 0;\n};',
              '    int axes = 0;\n    int buttons = 0;\n    int hats = 0;\n    Uint16 vid = 0;\n    Uint16 pid = 0;\n};')

          regex_once(
              'src/main/sdl2/input.cpp',
              r'    bool binding_matches_group_signature\(.*?\n    \}\n\n    int default_system_gamepad_button',
              '''    std::string signature_shape(const std::string& signature)\n    {\n        const size_t pos = signature.find('|');\n        return pos == std::string::npos ? signature : signature.substr(pos);\n    }\n\n    bool binding_matches_group_signature(\n        const device_binding_t& binding,\n        const std::string& signature,\n        int group)\n    {\n        if (!frontend_accepts_all_input_groups() &&\n            group != config.input_mode())\n        {\n            return false;\n        }\n\n        if (!binding_is_group(binding.device, group))\n            return false;\n\n        const std::string stored_signature =\n            raw_binding_signature(binding.device);\n\n        if (stored_signature == "*")\n            return false;\n\n        if (stored_signature == signature)\n            return true;\n\n        // SDL GUIDs can change across SDL revisions/backends. A VID/PID plus\n        // the stable axis/button/hat shape is a conservative fallback.\n        if (!binding.vid || !binding.pid ||\n            signature_shape(stored_signature) != signature_shape(signature))\n        {\n            return false;\n        }\n\n        for (const auto& device : input.get_devices())\n        {\n            if (input.get_device_signature(device.instance_id) == signature)\n            {\n                return device.vid == binding.vid && device.pid == binding.pid;\n            }\n        }\n\n        return false;\n    }\n\n    int default_system_gamepad_button''')

          replace_once(
              'src/main/sdl2/input.cpp',
              '    device.axes = SDL_JoystickNumAxes(joystick);\n    device.buttons = SDL_JoystickNumButtons(joystick);\n    device.hats = SDL_JoystickNumHats(joystick);',
              '    device.axes = SDL_JoystickNumAxes(joystick);\n    device.buttons = SDL_JoystickNumButtons(joystick);\n    device.hats = SDL_JoystickNumHats(joystick);\n    device.vid = SDL_JoystickGetVendor(joystick);\n    device.pid = SDL_JoystickGetProduct(joystick);')

          replace_once(
              'src/main/sdl2/input.cpp',
              '    binding.value = value;\n    binding.device = stored_device;\n    bindings.push_back(binding);',
              '''    binding.value = value;\n    binding.device = stored_device;\n\n    if (const InputDevice* physical = find_device(device))\n    {\n        binding.vid = physical->vid;\n        binding.pid = physical->pid;\n\n        if (type == device_binding_t::TYPE_AXIS)\n        {\n            int baseline_axis = index;\n            int current_value = 0;\n            bool current_valid = false;\n\n            if (group == BINDING_GAMEPAD && index < RAW_GAMEPAD_AXIS_BASE)\n            {\n                baseline_axis = CONTROLLER_AXIS_BASE + index;\n                if (SDL_GameController* pad = SDL_GameControllerFromInstanceID(device))\n                {\n                    current_value = SDL_GameControllerGetAxis(\n                        pad, static_cast<SDL_GameControllerAxis>(index));\n                    current_valid = true;\n                }\n            }\n            else\n            {\n                const int raw_axis =\n                    group == BINDING_GAMEPAD && index >= RAW_GAMEPAD_AXIS_BASE\n                        ? index - RAW_GAMEPAD_AXIS_BASE\n                        : index;\n                baseline_axis = raw_axis;\n                if (physical->joystick && raw_axis >= 0 && raw_axis < physical->axes)\n                {\n                    current_value = SDL_JoystickGetAxis(physical->joystick, raw_axis);\n                    current_valid = true;\n                }\n            }\n\n            if (current_valid)\n            {\n                for (const auto& baseline : axis_capture_baseline)\n                {\n                    if (baseline.device != device || baseline.axis != baseline_axis)\n                        continue;\n\n                    const int delta = current_value - baseline.value;\n                    if (target == device_binding_t::TARGET_ACCEL ||\n                        target == device_binding_t::TARGET_BRAKE)\n                    {\n                        // A pedal should increase when pressed.\n                        binding.invert = delta < 0;\n                    }\n                    else if (target == device_binding_t::TARGET_STEER)\n                    {\n                        // The editor asks for a LEFT turn. SDL convention is\n                        // negative-left; invert hardware that reports opposite.\n                        binding.invert = delta > 0;\n                    }\n                    break;\n                }\n            }\n        }\n    }\n\n    bindings.push_back(binding);''')

          replace_all(
              'src/main/sdl2/input.cpp',
              'binding_matches_group_signature(binding.device, signature, group)',
              'binding_matches_group_signature(binding, signature, group)',
              3)

          replace_once(
              'src/main/sdl2/input.cpp',
              '            int raw = value;\n',
              '            int raw = binding.invert ? -value : value;\n')

          replace_once(
              'src/main/sdl2/input.cpp',
              '            const int invert_slot =\n                binding.target == device_binding_t::TARGET_ACCEL ? 1 : 2;\n\n            int working = invert[invert_slot] ? -value : value;',
              '            int working = binding.invert ? -value : value;')

          # ------------------------------------------------------------------
          # SIMPLE / MODERN wheel FFB mode. Modern is the backwards-compatible
          # default. Simple directly translates original motor tables/commands.
          # ------------------------------------------------------------------
          replace_once(
              'src/main/frontend/config.hpp',
              '    void set_menu_sounds_enabled(bool enabled) \\\n    { \\\n        cfg.put_int("sound.menu_sounds", enabled ? 1 : 0); \\\n    } \\\n',
              '    void set_menu_sounds_enabled(bool enabled) \\\n    { \\\n        cfg.put_int("sound.menu_sounds", enabled ? 1 : 0); \\\n    } \\\n    bool ffb_modern_enabled() \\\n    { \\\n        return cfg.get_int("controls.analog.haptic.mode", 1) != 0; \\\n    } \\\n    void set_ffb_modern_enabled(bool enabled) \\\n    { \\\n        cfg.put_int("controls.analog.haptic.mode", enabled ? 1 : 0); \\\n    } \\\n')

          replace_once(
              'src/main/directx/ffeedback_base.cpp',
              '    static int g_offroad_pull_direction = 0;\n    static bool g_offroad_level_override_active = false;\n    static int g_offroad_level_override = 0;',
              '    static int g_offroad_pull_direction = 0;\n    static bool g_offroad_level_override_active = false;\n    static int g_offroad_level_override = 0;\n    static Uint16 g_bound_steering_vid = 0;\n    static Uint16 g_bound_steering_pid = 0;')

          replace_once(
              'src/main/directx/ffeedback_base.cpp',
              '        signature.clear();\n\n        for (auto it = config.controls.device_bindings.rbegin();',
              '        signature.clear();\n        g_bound_steering_vid = 0;\n        g_bound_steering_pid = 0;\n\n        for (auto it = config.controls.device_bindings.rbegin();')

          replace_once(
              'src/main/directx/ffeedback_base.cpp',
              '            if (!signature.empty())\n                return true;',
              '            if (!signature.empty())\n            {\n                g_bound_steering_vid = it->vid;\n                g_bound_steering_pid = it->pid;\n                return true;\n            }')

          regex_once(
              'src/main/directx/ffeedback_base.cpp',
              r'    static bool candidate_matches_signature\(\n        SDL_Joystick\* joystick,\n        const std::string& signature\)\n    \{.*?\n    \}',
              '''    static bool candidate_matches_signature(\n        SDL_Joystick* joystick,\n        const std::string& signature)\n    {\n        if (!joystick || signature.empty())\n            return false;\n\n        const std::string candidate = joystick_signature(joystick);\n        if (candidate == signature)\n            return true;\n\n        if (!g_bound_steering_vid || !g_bound_steering_pid ||\n            SDL_JoystickGetVendor(joystick) != g_bound_steering_vid ||\n            SDL_JoystickGetProduct(joystick) != g_bound_steering_pid)\n        {\n            return false;\n        }\n\n        const size_t stored_shape = signature.find('|');\n        const size_t candidate_shape = candidate.find('|');\n        return stored_shape != std::string::npos &&\n               candidate_shape != std::string::npos &&\n               signature.substr(stored_shape) == candidate.substr(candidate_shape);\n    }''')

          replace_once(
              'src/main/directx/ffeedback_base.cpp',
              '        tune_offroad_command(xdirection, force, source);\n\n        const int tuned_gain =\n            clamp_percent(tuned_gain_for_source(source));',
              '        if (config.ffb_modern_enabled())\n            tune_offroad_command(xdirection, force, source);\n        else\n            g_offroad_level_override_active = false;\n\n        const int tuned_gain =\n            config.ffb_modern_enabled()\n                ? clamp_percent(tuned_gain_for_source(source))\n                : clamp_percent(config.controls.ffb_strength);')

          replace_once(
              'src/main/directx/ffeedback_base.cpp',
              '            const int normalized_force =\n                normalized_force_for_source(force, source);',
              '            const int normalized_force =\n                config.ffb_modern_enabled()\n                    ? normalized_force_for_source(force, source)\n                    : std::max(0, std::min(7, force));')

          replace_once(
              'src/main/directx/ffeedback_base.cpp',
              '        g_centering_percent = std::max(\n            0,\n            tuned_centering_for_source(percent, source));',
              '        g_centering_percent = config.ffb_modern_enabled()\n            ? std::max(0, tuned_centering_for_source(percent, source))\n            : 0;')

          replace_once(
              'src/main/directx/ffeedback.cpp',
              '    {\n        const bool grid_rev_request =\n',
              '    {\n        if (!config.ffb_modern_enabled())\n        {\n            set_tyre_slip_base(false, source);\n            return;\n        }\n\n        const bool grid_rev_request =\n')

          replace_once(
              'src/main/engine/ooutputs_base.cpp',
              '        case MODE_FFEEDBACK:\n        {\n            const bool start_sequence_ffb =',
              '''        case MODE_FFEEDBACK:\n        {\n            if (!config.ffb_modern_enabled())\n            {\n                // SIMPLE: translate the original OutRun moving-cabinet motor\n                // commands directly. No generated spring, engine sine, custom\n                // crash choreography or DX off-road pull is layered on top.\n                forcefeedback::set_tyre_slip(false);\n                forcefeedback::set_centering_strength(0);\n                reset_crash_ffb_tracking();\n                reset_start_sequence_ffb_tracking();\n                do_motors(mode, input_motor);\n                motor_output(hw_motor_control);\n                break;\n            }\n\n            const bool start_sequence_ffb =''')

          replace_once(
              'src/main/engine/ooutputs_base.cpp',
              '            if (MODE == MODE_FFEEDBACK)\n            {\n                if (!skid_ffb_active)',
              '            if (MODE == MODE_FFEEDBACK && config.ffb_modern_enabled())\n            {\n                if (!skid_ffb_active)')

          replace_once(
              'src/main/engine/ooutputs_base.cpp',
              '                if (MODE == MODE_FFEEDBACK &&\n                    oferrari.wheel_state == OFerrari::WHEELS_ON)',
              '                if (MODE == MODE_FFEEDBACK &&\n                    config.ffb_modern_enabled() &&\n                    oferrari.wheel_state == OFerrari::WHEELS_ON)')

          replace_once(
              'src/main/engine/ooutputs_base.cpp',
              '    if (mode == MODE_FFEEDBACK)\n    {\n        hw_motor_control = MOTOR_OFF;\n        forcefeedback::stop();\n        return;\n    }',
