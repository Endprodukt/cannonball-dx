name: Fix hi-res shadow bottom row

on:
  push:
    branches: [test/graphics-regression-clean]
    paths:
      - .github/workflows/shadow-bottom-row-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/graphics-regression-clean
          fetch-depth: 0

      - name: Restore clean shadow sources and trim hi-res shadow edge
        shell: pwsh
        run: |
          git fetch origin master
          git checkout origin/master -- src/main/engine/oferrari_base.cpp src/main/engine/osprites.cpp

          $path = 'src/main/hwvideo/hwsprites.cpp'
          $text = (Get-Content $path -Raw).Replace("`r`n", "`n")

          $old = @(
            '        uint8_t shadow    =  (ramBuff[data+3] >> 14) & 1;',
            '//        int32_t  zoom     =   ramBuff[data+3] & 0x7ff;',
            '        int32_t  zoom     =   ramBuff[data+3] & 0x0fff;'
          ) -join "`n"

          $new = @(
            '        uint8_t shadow    =  (ramBuff[data+3] >> 14) & 1;',
            '//        int32_t  zoom     =   ramBuff[data+3] & 0x7ff;',
            '        int32_t  zoom     =   ramBuff[data+3] & 0x0fff;',
            '',
            '        // Hi-res shadow sprites expose one invalid trailing source row as a',
            '        // dark horizontal stripe. The original 1x hardware path is correct;',
            '        // trim one logical destination row only for actual shadow sprites.',
            '        if (shadow && render_scale > 1 && height > 1)',
            '            height--;'
          ) -join "`n"

          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected one shadow/zoom block, found $count" }
          $text = $text.Replace($old, $new)
          Set-Content $path $text -Encoding UTF8 -NoNewline

          git diff --check
          git diff -- src/main/engine/oferrari_base.cpp src/main/engine/osprites.cpp src/main/hwvideo/hwsprites.cpp

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/engine/oferrari_base.cpp src/main/engine/osprites.cpp src/main/hwvideo/hwsprites.cpp
          git commit -m 'Trim invalid hi-res shadow bottom row'
          git push origin HEAD:test/graphics-regression-clean
