name: Apply contact-based surface rattle fix

on:
  push:
    branches:
      - agent/rough-surface-crash-ffb

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rough-surface-crash-ffb
          fetch-depth: 0

      - name: Move strip contact detection to thickness sprites
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/main/engine/olevelobjs.cpp')
          text = p.read_text(encoding='utf-8')

          contact_block = '''\n    // Sand (routine 10) and stone (routine 11) are visual strips rather than\n    // normal collision objects. Reuse the ROM's horizontal sprite bounds only\n    // when the strip has reached the car plane. This makes FFB follow the\n    // visible loose material instead of the stage ID. Routine 14 is an ending\n    // sequence sand sprite and is intentionally excluded.\n    if ((sprite->function_holder == 10 || sprite->function_holder == 11) &&\n        z16 >= 0x1B0)\n    {\n        uint32_t offset_addr = SPRITE_X_OFFS + sprite->type;\n        int16_t x1;\n        int16_t x2;\n\n        if (sprite->control & OSprites::HFLIP)\n        {\n            x2 = (int16_t) roms.rom0.read16(&offset_addr);\n            x1 = (int16_t) roms.rom0.read16(&offset_addr);\n            x2 = -x2;\n            x1 = -x1;\n        }\n        else\n        {\n            x1 = (int16_t) roms.rom0.read16(&offset_addr);\n            x2 = (int16_t) roms.rom0.read16(&offset_addr);\n        }\n\n        if (!(sprite->x + x1 > 0 || sprite->x + x2 < 0))\n            rough_surface_contact = true;\n    }\n'''

          if text.count(contact_block) != 1:
              raise SystemExit(f'Expected one misplaced contact block, found {text.count(contact_block)}')

          # Remove the block from sprite_minitree.
          text = text.replace(contact_block, '\n', 1)

          # Insert it only inside do_thickness_sprite, using the function header
          # to make the target unambiguous.
          marker = '''void OLevelObjs::do_thickness_sprite(oentry* sprite, const uint32_t sprite_table_address)\n{'''
          start = text.find(marker)
          if start < 0:
              raise SystemExit('do_thickness_sprite not found')

          target = '''    if (road_x >= (160 + config.s16_x_off) || road_x < -(160 + config.s16_x_off)) return;\n    sprite->x = road_x;\n\n    // 44fc'''
          pos = text.find(target, start)
          if pos < 0:
              raise SystemExit('do_thickness_sprite insertion point not found')

          replacement = '''    if (road_x >= (160 + config.s16_x_off) || road_x < -(160 + config.s16_x_off)) return;\n    sprite->x = road_x;''' + contact_block + '''\n    // 44fc'''
          text = text[:pos] + text[pos:].replace(target, replacement, 1)
          p.write_text(text, encoding='utf-8')

      - name: Commit correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/engine/olevelobjs.cpp
          git commit -m "Move rough-surface contact detection to strip sprites"
          git push
