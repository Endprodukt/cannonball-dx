name: Apply input defaults refactor

on:
  push:
    branches:
      - menu-actions-decoupled

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-input-refactor]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: menu-actions-decoupled

      - name: Apply source refactor
        run: python3 .github/scripts/apply_input_defaults_refactor.py

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main
          git diff --cached --check
          git commit -m "Refine menu actions and MAME keyboard defaults"
          git push origin HEAD:menu-actions-decoupled
