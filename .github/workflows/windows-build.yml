name: Windows Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build tools
        shell: pwsh
        run: |
          cmake --version
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            throw "vcpkg was not found at $env:VCPKG_ROOT"
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-release -A x64 `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DWITH_MARCH_NATIVE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build\Release\cannonball-dx.exe")) {
            throw "Release build completed without producing cannonball-dx.exe"
          }

      - name: Assemble Windows release package
        shell: pwsh
        run: |
          $dist = "dist\cannonball-dx"
          Remove-Item -Recurse -Force "dist" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dist | Out-Null
          New-Item -ItemType Directory -Force "$dist\roms" | Out-Null

          Copy-Item "build\Release\cannonball-dx.exe" $dist
          Copy-Item "build\Release\*.dll" $dist -ErrorAction SilentlyContinue

          # Runtime data expected beside the executable.
          Copy-Item "build\gamecontrollerdb.txt" $dist

          # Ship runtime resources and documentation. tilemap.bin and tilepatch.bin
          # belong under res only and must not be duplicated in the release root.
          Copy-Item "res" "$dist\res" -Recurse
          Copy-Item "docs" "$dist\docs" -Recurse
          Copy-Item "roms\roms.txt" "$dist\roms\roms.txt"

          # User-facing release readme only. Repository documentation such as
          # README.md, EXTERNAL_OUTPUTS.md and CHANGELOG stays out of the package.
          Copy-Item "README.txt" $dist

          # Guard against accidentally reintroducing repository-only files.
          $forbiddenDocs = @("README.md", "EXTERNAL_OUTPUTS.md", "CHANGELOG", "CHANGELOG.md")
          $unexpectedDocs = Get-ChildItem $dist -Recurse -File | Where-Object { $_.Name -in $forbiddenDocs }
          if ($unexpectedDocs) {
            $unexpectedDocs | Select-Object FullName
            throw "Repository-only documentation was found in the Windows release package."
          }

          foreach ($rootOnlyResource in @("tilemap.bin", "tilepatch.bin")) {
            if (Test-Path (Join-Path $dist $rootOnlyResource)) {
              throw "$rootOnlyResource must only exist under res, not in the release root."
            }
          }

          Write-Host "Windows package contents:"
          Get-ChildItem $dist -Recurse | Select-Object FullName

      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: cannonball-dx-windows-${{ github.ref_name }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: dist/cannonball-dx
