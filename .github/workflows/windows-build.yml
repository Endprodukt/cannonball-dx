name: Windows Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build tools
        shell: pwsh
        run: |
          cmake --version
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            throw "vcpkg was not found at $env:VCPKG_ROOT"
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-release -A x64 `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DWITH_MARCH_NATIVE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build\Release\cannonball-dx.exe")) {
            throw "Release build completed without producing cannonball-dx.exe"
          }

      - name: Assemble Windows release package
        shell: pwsh
        run: |
          $dist = "dist\cannonball-dx"
          Remove-Item -Recurse -Force "dist" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dist | Out-Null
          New-Item -ItemType Directory -Force "$dist\roms" | Out-Null

          Copy-Item "build\Release\cannonball-dx.exe" $dist
          Copy-Item "build\Release\*.dll" $dist -ErrorAction SilentlyContinue

          # Runtime data expected beside the executable.
          Copy-Item "build\tilemap.bin" $dist
          Copy-Item "build\tilepatch.bin" $dist
          Copy-Item "build\gamecontrollerdb.txt" $dist

          # Ship the complete runtime resources and documentation, including all
          # CannonBall/CannonBall-SE/third-party license and notice files.
          Copy-Item "res" "$dist\res" -Recurse
          Copy-Item "docs" "$dist\docs" -Recurse
          Copy-Item "roms\roms.txt" "$dist\roms\roms.txt"

          Copy-Item "README.md" $dist
          Copy-Item "README.txt" $dist
          Copy-Item "CHANGELOG" $dist
          Copy-Item "EXTERNAL_OUTPUTS.md" $dist

          Write-Host "Windows package contents:"
          Get-ChildItem $dist -Recurse | Select-Object FullName

      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: cannonball-dx-windows-${{ github.ref_name }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: dist/cannonball-dx

  archive-branches:
    name: One-time stale branch archive
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[branch-cleanup]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive and remove stale branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          # Keep the branches that still represent active work. Everything else
          # is preserved as a dated archive tag before the branch ref is removed.
          keep_branch() {
            case "$1" in
              master|linux-parity|bin-music-support|logitech-g29-softlock-test|logitech-softlock-test|multiplayer-test|refactor/master-readability)
                return 0 ;;
              *)
                return 1 ;;
            esac
          }

          archived=0
          kept=0
          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == "HEAD" ]] && continue
            if keep_branch "$branch"; then
              echo "KEEP active: $branch"
              kept=$((kept + 1))
              continue
            fi

            tag="archive/2026-09-23/$branch"
            echo "ARCHIVE: $branch -> $tag"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              git tag "$tag" "refs/remotes/origin/$branch"
              git push origin "refs/tags/$tag"
            fi
            git push origin --delete "$branch"
            archived=$((archived + 1))
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)

          echo "Branch archive complete: archived=$archived active=$kept"
